task1_pose_nav:
  ros__parameters:
    # 官方 App 地图/定位继续使用，不在本阶段处理建图。
    pose_topic: "/map_tf_distribution/localization_pose"
    cmd_vel_topic: "/cmd_vel"

    # 任务1专用接口；不再与后续服务导航共用 /goal_pose。
    goal_pose_topic: "/race_task/task1/goal_pose"
    nav_status_topic: "/race_task/task1/nav_status"

    # 必须为 true：节点启动后只等待 Coordinator 的 PoseStamped，绝不自动走。
    wait_for_goal_from_rviz: true

    # 因为 wait_for_goal_from_rviz=true，这三个值当前不会触发导航。
    # 仅作为备用值保留。
    target_x: 0.0
    target_y: 0.0
    target_yaw: 0.0

    goal_xy_tolerance: 0.25
    goal_yaw_tolerance: 0.35
    final_yaw_enable: true

    max_forward_velocity: 0.30
    min_forward_velocity: 0.20
    max_angular_velocity: 0.35
    min_angular_velocity: 0.10

    k_linear: 0.45
    k_angular: 0.90
    heading_tolerance: 0.25

    pose_timeout_sec: 1.0
    wait_localization_timeout_sec: 60.0
    control_hz: 20.0

cmd_vel_bridge:
  ros__parameters:
    cmd_vel_topic: "/cmd_vel"
    output_topic: "/aima/mc/locomotion/velocity"
    source: "node"
    register_input_source: true
    publish_hz: 50.0

    max_forward_velocity: 0.30
    max_backward_velocity: 0.20
    max_lateral_velocity: 0.0
    max_angular_velocity: 0.35

    min_forward_velocity: 0.20
    min_lateral_velocity: 0.20
    min_angular_velocity: 0.10

    cmd_timeout_sec: 0.5
